name: Build

# Every push and pull request: analyze, test, and build the macOS, Windows and
# Linux apps. Pushing a tag like v1.1.0 also publishes them as a GitHub
# release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: '3.47.9'

# Pastee installs its own updates from these builds, so the third-party
# action that sets up Flutter is pinned to a commit, not a movable tag.

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Read the version from pubspec.yaml
        id: version
        run: |
          version=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          [[ -n "$version" ]] || { echo "::error::no version in pubspec.yaml"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match version $version in pubspec.yaml"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && ! grep -qE "^## ${version//./\\.}( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  macos:
    name: macOS app
    needs: test
    runs-on: macos-26
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Also runs the update's finishing script under macOS's /bin/sh.
      - run: flutter test
      - name: Build
        run: >
          flutter build macos --release
          --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"
          --dart-define=PASTEE_VERSION="$VERSION"
      - name: Re-sign without debugger access
        run: |
          # Xcode's ad-hoc signing adds get-task-allow, which lets debuggers
          # attach and read the app's memory. Pastee holds passwords, so the
          # release is re-signed with only the entitlements it needs.
          APP=build/macos/Build/Products/Release/Pastee.app
          codesign --force --sign - --entitlements macos/Runner/Release.entitlements "$APP"
          if codesign -d --entitlements - "$APP" 2>/dev/null | grep -q get-task-allow; then
            echo "::error::get-task-allow is still present"
            exit 1
          fi
      - name: Check the app bundle
        run: |
          APP=build/macos/Build/Products/Release/Pastee.app
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          archs=$(lipo -archs "$APP/Contents/MacOS/Pastee"); echo "Architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          codesign -d --entitlements - "$APP" || true
      - name: Package
        run: |
          APP=build/macos/Build/Products/Release/Pastee.app
          mkdir -p dist/dmg
          cp -R "$APP" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          # hdiutil is occasionally "busy" on CI machines.
          ok=
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "Pastee" -srcfolder dist/dmg -ov -format UDZO "dist/Pastee-$VERSION-macos.dmg"; then ok=1; break; fi
            echo "hdiutil failed (attempt $attempt), retrying"; rm -f "dist/Pastee-$VERSION-macos.dmg"; sleep $((attempt * 10))
          done
          test -n "$ok"
          hdiutil verify "dist/Pastee-$VERSION-macos.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Pastee-$VERSION-macos.zip"
          rm -rf dist/dmg
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: pastee-macos
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows app
    needs: test
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Also covers the DPAPI key protection, which only exists on Windows.
      - run: flutter test
      - name: Build
        run: >
          flutter build windows --release
          --build-name "$env:VERSION" --build-number "$env:GITHUB_RUN_NUMBER"
          --dart-define=PASTEE_VERSION="$env:VERSION"
      - name: Package
        run: |
          $release = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$release\pastee.exe")) { throw "pastee.exe was not built" }
          # pastee.exe and the local_auth plugin link against the Visual C++
          # runtime. Ship it next to the exe so Pastee also starts on PCs without
          # the redistributable installed (app-local deployment).
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" $release
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$release\*" -DestinationPath "dist\Pastee-$env:VERSION-windows-x64.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version=6.7.1 --allow-downgrade -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" windows\installer\pastee.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist
      # Pastee updates itself by quitting and running the new setup with
      # exactly these switches (see windowsSetupScript in
      # lib/services/update_installer.dart): no install-mode switch, so the
      # setup updates the copy that's there instead of adding a second one,
      # and /relaunch=1, so it starts Pastee again.
      - name: Check the setup's silent update
        run: |
          $setup = (Resolve-Path "dist\Pastee-$env:VERSION-windows-x64-setup.exe").Path
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Pastee'
          function Run-Setup([string[]]$switches, [string]$log) {
            $process = Start-Process $setup -ArgumentList ($switches + "/LOG=$log") -PassThru
            $null = $process.Handle
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) { throw "setup exited with $($process.ExitCode)" }
          }
          # Inno Setup logs a [Run] entry only when it runs one.
          function Started([string]$log) {
            [bool](Select-String -Path $log -SimpleMatch -Pattern '-- Run entry --' -Quiet)
          }
          $update = @('/SILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CLOSEAPPLICATIONS', '/relaunch=1')

          function Check-Update([string]$folder, [string]$log, [string]$elsewhere) {
            Run-Setup $update $log
            if (-not (Started $log)) {
              Get-Content $log
              throw "/relaunch=1 didn't start Pastee"
            }
            if (Test-Path "$elsewhere\pastee.exe") {
              Get-Content $log
              throw "the update installed a second copy in $elsewhere instead of updating $folder"
            }
            $running = $null
            for ($i = 0; $i -lt 20 -and -not $running; $i++) {
              Start-Sleep -Milliseconds 500
              $running = Get-Process pastee -ErrorAction SilentlyContinue
            }
            if ($running) { Write-Host "Pastee started again: $($running.Path)" }
            else { Write-Host "::warning::The setup started pastee.exe, but it wasn't running a moment later" }
            Get-Process pastee -ErrorAction SilentlyContinue | Stop-Process -Force
            $uninstall = Start-Process "$folder\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -PassThru
            $uninstall.WaitForExit()
            # The uninstaller hands over to a copy of itself and returns early.
            for ($i = 0; $i -lt 60 -and (Test-Path "$folder\pastee.exe"); $i++) { Start-Sleep -Milliseconds 500 }
            if (Test-Path "$folder\pastee.exe") { throw "Pastee wasn't uninstalled from $folder" }
          }

          # Installed for the current user, the default.
          Run-Setup @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER') "$env:RUNNER_TEMP\install.log"
          if (-not (Test-Path "$app\pastee.exe")) { throw "Pastee isn't in $app" }
          if (-not (Test-Path "$app\unins000.exe")) { throw "no uninstaller next to pastee.exe" }
          if (Started "$env:RUNNER_TEMP\install.log") { throw "a silent install without /relaunch=1 started Pastee" }
          Check-Update $app "$env:RUNNER_TEMP\update.log" "$env:ProgramFiles\Pastee"

          # Installed for all users, in a folder of its own choosing.
          $shared = 'C:\PasteeTest'
          Run-Setup @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS', "/DIR=$shared") "$env:RUNNER_TEMP\install-all.log"
          if (-not (Test-Path "$shared\pastee.exe")) { throw "Pastee isn't in $shared" }
          Check-Update $shared "$env:RUNNER_TEMP\update-all.log" $app
      - uses: actions/upload-artifact@v7
        with:
          name: pastee-windows
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Linux app (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc baseline low: the package needs 2.34+
          # (Ubuntu 22.04, Debian 12, Fedora 35 and later).
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    env:
      VERSION: ${{ needs.test.outputs.version }}
      BUNDLE: build/linux/${{ matrix.arch }}/release/bundle
    steps:
      - uses: actions/checkout@v7
      - name: Install the build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev \
            libgl1-mesa-dri xvfb xauth xdotool dbus dpkg-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: matrix.arch == 'x64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Flutter publishes no Linux arm64 SDK archive, but the release tag
      # builds there: the tool fetches the arm64 Dart SDK and engine itself.
      - name: Set up Flutter from git (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get
      - name: Build
        run: >
          flutter build linux --release
          --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"
          --dart-define=PASTEE_VERSION="$VERSION"
      # Starts and stays up, registers and receives the X11 shortcut, and a
      # second `pastee --toggle` reaches it over D-Bus.
      - name: Smoke test
        run: >
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x900x24"
          linux/packaging/smoke-test.sh "$BUNDLE"
      - name: Package
        run: |
          linux/packaging/build-packages.sh "$BUNDLE" "$VERSION" "${{ matrix.arch }}" dist
          dpkg-deb --info "dist/Pastee-$VERSION-linux-${{ matrix.arch }}.deb"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: pastee-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish the release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, macos, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: pastee-*
          path: dist
          merge-multiple: true
      - name: Write the release notes
        run: |
          # The CHANGELOG section for this version, then the install guide.
          awk -v v="$VERSION" '
            index($0, "## " v) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat .github/release-install.md >> notes.md
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          cat notes.md
          ls -la dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v$VERSION" dist/*
          --title "Pastee $VERSION" --notes-file notes.md --verify-tag
