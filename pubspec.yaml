name: pastee
description: "Instant Shortcut Notes — a keyboard-first clipboard notes app for macOS, Windows and Linux."
publish_to: 'none'
version: 1.4.0+6

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  characters: ^1.3.0
  crypto: ^3.0.3
  ffi: ^2.1.0
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  path: ^1.9.0
  path_provider: ^2.1.4
  # Pastee never runs on Android. path_provider_android 2.3+ pulls in package:jni,
  # which builds and bundles a stray jni.dll into the Windows app, so stay below it.
  path_provider_android: '>=2.2.18 <2.3.0'
  uuid: ^4.3.3
  local_auth: ^3.0.2
  clock: ^1.1.1
  unorm_dart: ^0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
